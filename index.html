<body>
<a class="skip" href="#main">Skip to content</a>

<script>
/* If app.js did not run, the folder was probably not extracted fully. */
window.addEventListener('load', function () {
  if (window.__courseLanding) return;
  var a = document.getElementById('app');
  if (a) a.innerHTML = '<div style="max-width:640px;margin:48px auto;padding:20px 24px;border:2px solid #BE123C;border-radius:12px;font-family:system-ui,sans-serif;line-height:1.6">' +
    '<h1 style="font-size:20px;margin:0 0 8px;color:#BE123C">The page files are missing / Fail halaman tidak lengkap</h1>' +
    '<p style="margin:0 0 8px">Extract the whole zip folder first (right-click, Extract All), then open index.html from the extracted folder. Do not open it from inside the zip.</p>' +
    '<p style="margin:0">Ekstrak keseluruhan folder zip dahulu (klik kanan, Extract All), kemudian buka index.html daripada folder yang diekstrak. Jangan buka dari dalam zip.</p></div>';
});
</script>
</body>
